# Forward_Chat — pipeline estricto de CI/CD.
# Secuencia: dependencias -> lint estricto -> tests -> builds de producción
# (frontend + backend) -> validación de imágenes Docker.

name: CI/CD

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint estricto (sintaxis de todos los módulos del servidor)
        run: |
          set -e
          node --check index.js
          for f in server/*.js server/handlers/*.js; do
            node --check "$f"
          done

      - name: Tests unitarios
        run: npm test

  frontend:
    name: Frontend · lint, typecheck y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Typecheck estricto (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build de producción
        run: npm run build

      - name: Publicar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
          retention-days: 7

  docker:
    name: Docker · validar imágenes de producción
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build imagen backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: forward-chat-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          file: Frontend/Dockerfile
          push: false
          tags: forward-chat-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Validar docker-compose
        run: docker compose config -q
